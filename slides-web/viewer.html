<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
@FONTS
<style>
  html, body { margin: 0; height: 100%; background: #0b141b; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; background: #f3f8f8; overflow: hidden; }

  /* ---- slide canvas (the Claude Slides subset, rebuilt in plain CSS) ---- */
  .slide { position: absolute; inset: 0; width: 1920px; height: 1080px; box-sizing: border-box; overflow: hidden;
    display: flex; flex-direction: column; font-family: Sarabun, Tahoma, sans-serif; font-size: 32px; line-height: 1.4; color: #1f3a4d;
    opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility 0s linear .45s; }
  .slide.on { opacity: 1; visibility: visible; transition: opacity .45s ease, visibility 0s; }
  .slide *, .slide *::before, .slide *::after { box-sizing: border-box; }
  .slide div { min-width: 0; }
  .slide div:not([style*="display"]) { display: flex; flex-direction: column; }
  .slide div[data-text] { display: block; }
  .slide h1, .slide h2, .slide h3, .slide p, .slide ul, .slide ol, .slide table { margin: 0; }
  .slide h1 { font-size: 96px; font-weight: 600; line-height: 1.1; }
  .slide h2 { font-size: 64px; font-weight: 600; line-height: 1.15; }
  .slide h3 { font-size: 44px; font-weight: 600; line-height: 1.2; }
  .slide ul, .slide ol { padding-left: 1.2em; }
  .slide li { padding-left: .15em; }
  .slide li::marker { color: currentColor; }
  .slide b { font-weight: 700; }
  .slide img { display: block; flex: none; object-fit: cover; max-width: none; }
  .slide video { display: block; flex: none; object-fit: cover; background: #000; }
  .slide table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .slide th, .slide td { border: 1px solid #c9d8dc; padding: .35em .6em; text-align: left; vertical-align: top; }
  .slide th { font-weight: 600; }
  .slide .x-icon { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 48px; height: 48px; }
  .slide .x-icon svg { width: 62%; height: 62%; }
  .slide .x-shape { display: block; flex: none; }
  .slide .k-ellipse { border-radius: 50%; }
  .slide .k-diamond { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .slide .k-arrow-right { clip-path: polygon(0 30%, 60% 30%, 60% 0, 100% 50%, 60% 100%, 60% 70%, 0 70%); }
  .slide .k-arrow-left { clip-path: polygon(100% 30%, 40% 30%, 40% 0, 0 50%, 40% 100%, 40% 70%, 100% 70%); }
  .slide .k-arrow-down { clip-path: polygon(30% 0, 70% 0, 70% 60%, 100% 60%, 50% 100%, 0 60%, 30% 60%); }
  .slide .k-arrow-up { clip-path: polygon(30% 100%, 70% 100%, 70% 40%, 100% 40%, 50% 0, 0 40%, 30% 40%); }

  /* builds: use the individual translate/scale properties so authored transforms stay intact */
  .slide [data-build-in] { transition: opacity .55s ease, translate .55s cubic-bezier(.2,.8,.2,1), scale .55s cubic-bezier(.2,.8,.2,1); }
  .slide [data-build-in].pre { opacity: 0; }
  .slide [data-build-in].pre.fx-rise { translate: 0 60px; }
  .slide [data-build-in].pre.fx-drop { translate: 0 -60px; }
  .slide [data-build-in].pre.fx-left { translate: -90px 0; }
  .slide [data-build-in].pre.fx-right { translate: 90px 0; }
  .slide [data-build-in].pre.fx-scale { scale: .85; }
  .slide [data-build-in].pre.fx-pop { scale: .6; }
  .slide [data-build-in].fx-pop { transition: opacity .4s ease, scale .5s cubic-bezier(.3,1.6,.5,1); }

  /* ---- chrome ---- */
  #bar { position: fixed; left: 0; bottom: 0; height: 4px; background: #6fb7c1; transition: width .3s; z-index: 5; }
  #hud { position: fixed; right: 16px; bottom: 14px; display: flex; gap: 8px; align-items: center; z-index: 5; font: 600 14px/1 Sarabun, Tahoma, sans-serif; color: #fff;
    opacity: 0; transition: opacity .3s; }
  body.show-hud #hud, #hud:hover { opacity: 1; }
  #hud button { all: unset; cursor: pointer; padding: 9px 12px; border-radius: 8px; background: rgba(15,30,42,.75); }
  #hud button:hover { background: rgba(62,142,154,.95); }
  #hud span { padding: 9px 12px; border-radius: 8px; background: rgba(15,30,42,.75); min-width: 64px; text-align: center; }
  #hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 6; padding: 10px 18px; border-radius: 10px; background: rgba(15,30,42,.85);
    color: #fff; font: 500 16px/1.3 Sarabun, Tahoma, sans-serif; transition: opacity .6s; pointer-events: none; }
</style>
</head>
<body class="show-hud">
<div id="stage">
@SLIDES
</div>
<div id="bar"></div>
<div id="hud">
  <button id="prev" title="ก่อนหน้า (←)">◀</button><span id="num"></span><button id="next" title="ถัดไป (→)">▶</button>
  <button id="full" title="เต็มจอ (F)">⛶ เต็มจอ</button>
</div>
<div id="hint">กด → / คลิก เพื่อเปลี่ยนสไลด์ · กด F เพื่อเต็มจอ</div>
<script>
(() => {
  const stage = document.getElementById("stage");
  const slides = [...stage.querySelectorAll(":scope > section.slide")].filter((s) => !s.hasAttribute("hidden"));
  const num = document.getElementById("num"), bar = document.getElementById("bar");
  let cur = -1, pending = [], timers = [];

  // fit the 1920x1080 stage in the window
  function fit() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transformOrigin = "50% 50%";
    stage.style.transform = `translate(-50%, -50%) scale(${k})`;
  }
  addEventListener("resize", fit); fit();

  // videos: <img data-video> -> <video> with the image as its poster
  slides.forEach((s) => s.querySelectorAll("img[data-video]").forEach((img) => {
    const v = document.createElement("video");
    v.src = img.dataset.video; v.poster = img.src; v.loop = true; v.playsInline = true; v.preload = "metadata";
    v.muted = img.dataset.videoSound !== "on"; v.dataset.sound = img.dataset.videoSound || ""; v.dataset.delay = img.dataset.videoDelay || "0";
    v.setAttribute("style", img.getAttribute("style") || ""); v.setAttribute("aria-label", img.alt || "");
    for (const a of ["data-build-in", "id"]) if (img.hasAttribute(a)) v.setAttribute(a, img.getAttribute(a));
    img.replaceWith(v);
  }));

  // builds: "effect [order] [auto]"
  function builds(s) {
    const items = [...s.querySelectorAll("[data-build-in]")].map((el, i) => {
      const t = el.dataset.buildIn.trim().split(/\s+/);
      const fx = t[0] || "fade", order = +(t.find((x) => /^\d+$/.test(x)) || 1), auto = t.includes("auto");
      return { el, fx, order, auto, i };
    });
    const groups = {};
    items.forEach((it) => (groups[it.order] = groups[it.order] || []).push(it));
    return Object.keys(groups).map(Number).sort((a, b) => a - b).map((k) => groups[k]);
  }
  function reveal(group) { group.forEach((it) => it.el.classList.remove("pre")); }

  function stopMedia(s) { s.querySelectorAll("video").forEach((v) => { v.pause(); try { v.currentTime = 0; } catch (e) {} }); }
  function playMedia(s) {
    s.querySelectorAll("video").forEach((v) => {
      timers.push(setTimeout(() => {
        v.muted = v.dataset.sound !== "on";
        const p = v.play();
        if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(() => {}); });
      }, (+v.dataset.delay || 0) * 1000 + 300));
    });
  }

  function go(n, instant) {
    n = Math.max(0, Math.min(slides.length - 1, n));
    timers.forEach(clearTimeout); timers = [];
    if (cur >= 0 && cur !== n) { slides[cur].classList.remove("on"); stopMedia(slides[cur]); }
    cur = n; const s = slides[n];
    const gs = builds(s);
    gs.flat().forEach((it) => { it.el.classList.add("pre", "fx-" + it.fx); });
    s.classList.add("on");
    pending = [];
    let t = 350;
    gs.forEach((g) => {
      if (g.every((it) => it.auto) && !pending.length) { const at = t; timers.push(setTimeout(() => reveal(g), at)); t += 380; }
      else pending.push(g);
    });
    if (instant) { gs.forEach(reveal); pending = []; }
    playMedia(s);
    num.textContent = `${n + 1} / ${slides.length}`;
    bar.style.width = ((n + 1) / slides.length) * 100 + "%";
    history.replaceState(null, "", "#" + (n + 1));
  }
  function next() { if (pending.length) reveal(pending.shift()); else if (cur < slides.length - 1) go(cur + 1); }
  function prev() { if (cur > 0) go(cur - 1, true); }

  addEventListener("keydown", (e) => {
    if (["ArrowRight", "PageDown", " ", "Enter", "ArrowDown"].includes(e.key)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "PageUp", "ArrowUp", "Backspace"].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === "Home") go(0); else if (e.key === "End") go(slides.length - 1);
    else if (e.key === "f" || e.key === "F") full();
  });
  function full() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  document.getElementById("next").onclick = (e) => { e.stopPropagation(); next(); };
  document.getElementById("prev").onclick = (e) => { e.stopPropagation(); prev(); };
  document.getElementById("full").onclick = (e) => { e.stopPropagation(); full(); };
  stage.addEventListener("click", (e) => { if (e.target.tagName !== "VIDEO") (e.clientX < innerWidth * 0.25 ? prev : next)(); });
  let tx = null;
  addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
  addEventListener("touchend", (e) => { if (tx == null) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 40) (d < 0 ? next : prev)(); tx = null; });

  let hudT; const hud = () => { document.body.classList.add("show-hud"); clearTimeout(hudT); hudT = setTimeout(() => document.body.classList.remove("show-hud"), 2500); };
  addEventListener("mousemove", hud); hud();
  setTimeout(() => (document.getElementById("hint").style.opacity = 0), 4000);

  // a page opened straight onto a video slide may only autoplay muted: the first click or key turns the sound on
  const unmute = () => { if (cur >= 0) slides[cur].querySelectorAll('video[data-sound="on"]').forEach((v) => { v.muted = false; }); };
  addEventListener("pointerdown", unmute, true); addEventListener("keydown", unmute, true);

  const h = parseInt(location.hash.slice(1), 10);
  go(isNaN(h) ? 0 : h - 1, true);
})();
</script>
</body>
</html>
